name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests (surefire) and Testcontainers integration tests (failsafe).
      # Docker is preinstalled on ubuntu-latest, so Testcontainers needs no extra setup.
      - name: Build and test
        run: mvn -B verify

  # The whole system as a reviewer runs it: docker compose up, then the end-to-end smoke test.
  e2e:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-webflux-poc
    steps:
      - uses: actions/checkout@v7

      - name: Create .env with random secrets
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')|" .env

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Smoke test through the gateway
        run: ../scripts/smoke-test.sh

      - name: Service logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose down -v
