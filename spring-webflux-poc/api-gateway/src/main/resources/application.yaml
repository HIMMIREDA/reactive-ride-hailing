server:
  port: 8085

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.server: DEBUG

jwt:
  secret: ${JWT_SECRET:}  # required, no default: see .env.example
spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/**

            - id: driver-service
              uri: ${DRIVER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/rides/proposals, /api/rides/nearby/stream

            - id: ride-service
              uri: ${RIDE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/rides/**

# Only the health endpoint is exposed (used by the docker compose healthchecks).
management:
  endpoints:
    web:
      exposure:
        include: health
