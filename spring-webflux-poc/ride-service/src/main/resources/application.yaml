server:
  port: 8083
spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  kafka:
    bootstrap-servers: localhost:9092
    properties:
        schema.registry.url: http://localhost:8081
        auto.register.schemas: false
    consumer:
      group-id: ride-service-consumer-group
      auto-offset-reset: earliest

  r2dbc:
    url: r2dbc:postgresql://localhost:15432/rides
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    url: jdbc:postgresql://localhost:15432/rides
    locations: classpath:db/migration

kafka:
  topics:
    ride-request-requested: "poc-ride-request-requested-v1"
    ride-proposal-accepted: "poc-ride-proposal-accepted-v1"
    ride-proposal-booked: "poc-ride-proposal-booked-v1"
    ride-proposal-proposed: "poc-ride-proposal-proposed-v1"