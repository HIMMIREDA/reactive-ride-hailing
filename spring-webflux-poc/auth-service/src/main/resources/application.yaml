server:
  port: 8082
spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  r2dbc:
    url: r2dbc:postgresql://localhost:15432/users
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    url: jdbc:postgresql://localhost:15432/users
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:}  # required, no default: see .env.example

# Only the health endpoint is exposed (used by the docker compose healthchecks).
management:
  endpoints:
    web:
      exposure:
        include: health
