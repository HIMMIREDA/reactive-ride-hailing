server:
  port: 8084
spring:
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:8081
      # Schemas are registered up front (schema-init / mvn schema-registry:register), never by producers.
      auto.register.schemas: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Only the outbox relay sends, while it holds the batch's locks/claims: fail fast when Kafka is
        # unreachable (the relay retries with backoff) instead of blocking for the 60s/120s defaults.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: driver-service-consumer-group
      auto-offset-reset: earliest
      # ErrorHandlingDeserializer: a record that can't be deserialized becomes a DeserializationException
      # handled by the error handler (-> dead-letter topic) instead of failing every poll.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
  data:
    mongodb:
      # Host side: the replica set member is "mongodb:27017", which only resolves inside the compose
      # network, so connect directly (change streams still work). See docker-compose.override.example.yml.
      uri: mongodb://localhost:27017/drives?directConnection=true
      auto-index-creation: true
kafka:
  topics:
    ride-request-requested: "poc-ride-request-requested-v1"
    ride-proposal-accepted: "poc-ride-proposal-accepted-v1"
    ride-proposal-booked: "poc-ride-proposal-booked-v1"
    ride-proposal-proposed: "poc-ride-proposal-proposed-v1"

# Only the health endpoint is exposed (used by the docker compose healthchecks).
management:
  endpoints:
    web:
      exposure:
        include: health

# Listener retries before a record goes to its dead-letter topic (<topic>.DLT).
app:
  kafka:
    retry:
      max-retries: 3
      initial-interval: 500ms
      multiplier: 2.0
      max-interval: 5s

  # Transactional outbox relay (see OutboxRelay).
  outbox:
    relay-enabled: true
    poll-interval: 500ms
    batch-size: 100
    initial-backoff: 1s
    max-backoff: 30s

  # One shared MongoDB change stream for all SSE subscribers (see RideRequestChangeStream).
  change-stream:
    subscriber-buffer: 256
    min-retry-backoff: 500ms
    max-retry-backoff: 30s
