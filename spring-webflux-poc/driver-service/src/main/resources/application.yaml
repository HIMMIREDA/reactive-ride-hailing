server:
  port: 8084
spring:
  kafka:
    bootstrap-servers: localhost:9092
    properties:
        schema.registry.url: http://localhost:8081
        auto.register.schemas: false
    consumer:
      group-id: driver-service-consumer-group
      auto-offset-reset: earliest
  data:
    mongodb:
      uri: mongodb://localhost:27017/drives?replicaSet=rs0

      auto-index-creation: true
kafka:
  topics:
    ride-requested: "poc-ride-requested-v1"
    ride-to-accept: "poc-ride-to-accept-v1"
    ride-booked: "poc-ride-booked-v1"
    ride-proposal: "poc-ride-proposed-v1"